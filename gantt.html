<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Leave Gantt</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="top">
  <span class="brand">Staff Leave</span>
  <nav class="tabs"><a href="index.html">Leave</a><a href="gantt.html" class="on">Gantt</a><a href="holidays.html">Holidays</a></nav>
  <span class="spacer"></span>
  <a class="icon-btn" href="data.html" title="Import, backup and reset" aria-label="Data settings">⚙</a>
  <button class="icon-btn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light/dark">◐</button>
</div>

<main class="wide">
  <div class="page-head"><h1>Gantt</h1></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Search name or ID" aria-label="Search">
    <select id="fDept" aria-label="Department"><option value="">All departments</option></select>
    <div class="period">
      <button class="step" id="prev" aria-label="Previous period">‹</button>
      <select id="period" aria-label="Period">
        <option value="month">This month</option>
        <option value="next3">Next 3 months</option>
        <option value="year">This year</option>
        <option value="custom">Custom dates…</option>
      </select>
      <button class="step" id="next" aria-label="Next period">›</button>
    </div>
    <div class="custom-range" id="customRange" hidden>
      <input type="date" id="dFrom" aria-label="From"><span class="muted">to</span><input type="date" id="dTo" aria-label="To">
    </div>
  </div>

  <p class="list-meta" id="meta"></p>
  <div class="gwrap"><table class="g" id="g"></table></div>
  <div class="legend">
    <span><i class="sw l"></i>Approved</span>
    <span><i class="sw p"></i>Pending</span>
    <span><i class="sw wk"></i>Sunday</span>
    <span><i class="sw hol"></i>Public holiday</span>
    <span><i class="sw td"></i>Today</span>
  </div>
</main>

<script src="data.js?v=4"></script>
<script src="shared.js?v=4"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
const TODAY = toISO(new Date());
const DOW = ["S","M","T","W","T","F","S"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const leaves = Store.load().filter(r => leaveDays(r) != null);
leaves.forEach(r => { r._s = effStart(r) || "9999"; r.dept = r.dept || "Not given"; });

// win = [from, to]; the arrows shift it by the same span
let win = null;
const P = (() => { try { return JSON.parse(localStorage.getItem("staffLeave.ganttV2")) || {}; } catch (e) { return {}; } })();
$("period").value = P.period || "month";
function save() { try { localStorage.setItem("staffLeave.ganttV2", JSON.stringify({ period: $("period").value, dept: $("fDept").value })); } catch (e) {} }

function presetWindow(p, anchor = new Date()) {
  const y = anchor.getFullYear(), m = anchor.getMonth();
  if (p === "month") return [toISO(new Date(y, m, 1)), toISO(new Date(y, m + 1, 0))];
  if (p === "next3") return [toISO(new Date(y, m, 1)), toISO(new Date(y, m + 3, 0))];
  if (p === "year") return [`${y}-01-01`, `${y}-12-31`];
  return null;
}
function step(dir) {
  const p = $("period").value, a = fromISO(win[0]);
  if (p === "month") win = presetWindow("month", new Date(a.getFullYear(), a.getMonth() + dir, 1));
  else if (p === "next3") win = presetWindow("next3", new Date(a.getFullYear(), a.getMonth() + dir * 3, 1));
  else if (p === "year") win = presetWindow("year", new Date(a.getFullYear() + dir, 0, 1));
  else { const n = daysBetween(win[0], win[1]) + 1; win = [toISO(addDays(a, dir * n)), toISO(addDays(fromISO(win[1]), dir * n))]; $("dFrom").value = win[0]; $("dTo").value = win[1]; }
  render();
}

function render() {
  save();
  $("customRange").hidden = $("period").value !== "custom";
  const [from, to] = win[0] <= win[1] ? win : [win[1], win[0]];
  const days = [];
  for (let d = fromISO(from); toISO(d) <= to; d = addDays(d, 1)) days.push(toISO(d));

  const q = $("q").value.trim().toLowerCase(), dep = $("fDept").value;
  const people = new Map();
  leaves.filter(r => (!dep || r.dept === dep) && (!q || `${r.id} ${r.name}`.toLowerCase().includes(q)) && r.to >= from && r._s <= to)
    .sort((a, b) => a._s < b._s ? -1 : 1)
    .forEach(r => {
      const key = r.id || r.name.toLowerCase();
      const p = people.get(key) || { name: r.name, id: r.id, dept: r.dept, leaves: [] };
      p.leaves.push(r); people.set(key, p);
    });
  const list = [...people.values()];
  const grouped = !dep;
  const groups = grouped ? [...new Set(list.map(p => p.dept))].sort().map(g => [g, list.filter(p => p.dept === g)]) : [["", list]];

  const compact = days.length > 100;
  $("g").className = "g" + (compact ? " compact" : "");
  const cls = s => { const c = []; if (HOLIDAYS[s]) c.push("hol"); else if (isSunday(s)) c.push("wk"); if (s === TODAY) c.push("today"); return c.join(" "); };
  const tip = s => `${fmt(s)}${HOLIDAYS[s] ? " · " + HOLIDAYS[s] : ""}`;

  let h = "<thead><tr><th class='name' rowspan='3'></th>";
  for (let i = 0; i < days.length;) {
    let n = 0; while (i + n < days.length && days[i + n].slice(0, 7) === days[i].slice(0, 7)) n++;
    const d = fromISO(days[i]);
    h += `<th class='mon' colspan='${n}'>${n * (compact ? 14 : 26) > 80 ? MONTHS_LONG[d.getMonth()] + " " + d.getFullYear() : MONTHS[d.getMonth()]}</th>`;
    i += n;
  }
  h += "</tr><tr>" + days.map(s => `<th class='day dow ${cls(s)}' title='${tip(s)}'>${compact ? "" : DOW[fromISO(s).getDay()]}</th>`).join("");
  h += "</tr><tr>" + days.map(s => { const d = fromISO(s).getDate(); return `<th class='day dnum ${cls(s)}' title='${tip(s)}'>${compact ? (d === 1 || d % 5 === 0 ? d : "") : d}</th>`; }).join("");
  h += "</tr></thead><tbody>";

  const away = days.map(() => 0);
  groups.forEach(([g, ppl]) => {
    if (grouped) h += `<tr class='grp'><th class='name'>${esc(g)}</th><td colspan='${days.length}'></td></tr>`;
    ppl.forEach(p => {
      const st = days.map(s => {
        let v = "", t = null;
        for (const r of p.leaves) if (s >= r._s && s <= r.to) { if (r.approved) { v = "l"; t = r; break; } if (!v) { v = "p"; t = r; } }
        return [v, t];
      });
      h += `<tr><th class='name' title='${esc(p.name)} · ${esc(p.id)} · ${esc(p.dept)}'>${esc(p.name)}</th>`;
      st.forEach(([v, r], k) => {
        if (v) away[k]++;
        const s = v && st[k - 1]?.[0] !== v ? " s" : "", e = v && st[k + 1]?.[0] !== v ? " e" : "";
        const t = v ? `${p.name}: ${fmt(r._s)} – ${fmt(r.to)}, ${leaveDays(r)} days, ${r.approved ? "approved" : "pending"}` : tip(days[k]);
        h += `<td class='day ${cls(days[k])} ${v}${s}${e}' title='${esc(t)}'></td>`;
      });
      h += "</tr>";
    });
  });
  const peak = Math.max(0, ...away);
  h += "<tr class='tot'><th class='name'>Away</th>" + days.map((s, k) => {
    const n = away[k], heat = !n ? "" : n >= peak * 0.8 ? "h3" : n >= peak * 0.45 ? "h2" : "h1";
    return `<td class='day ${cls(s)} ${heat}' title='${fmt(s)}: ${n} away'>${n || ""}</td>`;
  }).join("") + "</tr></tbody>";

  $("g").innerHTML = list.length ? h : `<tr><td class="empty">Nobody is on leave in this period.</td></tr>`;

  const label = $("period").value === "month" ? MONTHS_LONG[fromISO(from).getMonth()] + " " + from.slice(0, 4)
    : $("period").value === "year" ? from.slice(0, 4) : `${fmt(from)} – ${fmt(to)}`;
  const busy = days[away.indexOf(peak)];
  $("meta").textContent = list.length
    ? `${label}: ${list.length} ${list.length === 1 ? "person" : "people"} on leave` + (peak > 1 ? ` · busiest day ${fmt(busy)} with ${peak} away` : "")
    : label;

  const ti = days.indexOf(TODAY);
  $("g").parentElement.scrollLeft = ti > 7 ? (ti - 4) * (compact ? 14 : 26) : 0;
}

const depts = [...new Set(leaves.map(r => r.dept))].sort();
$("fDept").innerHTML += depts.map(d => `<option>${esc(d)}</option>`).join("");
if (P.dept && depts.includes(P.dept)) $("fDept").value = P.dept;

$("period").addEventListener("change", () => {
  if ($("period").value === "custom") { $("dFrom").value = win[0]; $("dTo").value = win[1]; }
  else win = presetWindow($("period").value);
  render();
});
["dFrom", "dTo"].forEach(id => $(id).addEventListener("change", () => {
  if (validISO($("dFrom").value) && validISO($("dTo").value)) { win = [$("dFrom").value, $("dTo").value]; render(); }
}));
["q", "fDept"].forEach(id => $(id).addEventListener("input", render));
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));

if ($("period").value === "custom") $("period").value = "month";
win = presetWindow($("period").value);
render();
</script>
</body>
</html>
