<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Leave Gantt</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="top">
  <span class="brand">Staff Leave</span>
  <nav class="tabs"><a href="index.html">Leave</a><a href="gantt.html" class="on">Gantt</a><a href="holidays.html">Holidays</a></nav>
  <span class="spacer"></span>
  <a class="icon-btn" href="data.html" title="Import, backup and reset" aria-label="Data settings">⚙</a>
  <button class="icon-btn" id="themeBtn" title="Toggle light/dark">◐</button>
</div>
<main>
  <h1 id="title">Team leave</h1>
  <p class="sub" id="subtitle">Scroll sideways to see all dates. Names stay pinned on the left.</p>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <label class="field">Timeline<select id="preset">
      <option value="month">This month</option>
      <option value="next30">Next 30 days</option>
      <option value="next90">Next 90 days</option>
      <option value="q1">Q1 (Jan–Mar)</option>
      <option value="q2">Q2 (Apr–Jun)</option>
      <option value="q3">Q3 (Jul–Sep)</option>
      <option value="q4">Q4 (Oct–Dec)</option>
      <option value="year">Full year</option>
      <option value="custom">Custom dates</option>
    </select></label>
    <label class="field">Year<select id="year"><option>2026</option><option>2027</option></select></label>
    <label class="field">From<input type="date" id="dFrom"></label>
    <label class="field">To<input type="date" id="dTo"></label>
    <button class="btn" id="prevBtn" title="Shift the window back">◀</button>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn" id="nextBtn" title="Shift the window forward">▶</button>
    <label class="field">Search<input type="search" id="q" placeholder="Name or ID"></label>
    <label class="field">Show<select id="status"><option value="all">Approved + pending</option><option value="ap">Approved only</option></select></label>
    <label class="field">Group by<select id="group"><option value="dept">Department</option><option value="none">No grouping</option></select></label>
    <label class="field">Rows<select id="onlyAway"><option value="1">Only people on leave in range</option><option value="0">Everyone</option></select></label>
  </div>
  <div class="bar"><div class="chips" id="deptChips"></div></div>

  <div class="legend">
    <span><i class="sw l"></i>Approved leave</span>
    <span><i class="sw p"></i>Pending approval</span>
    <span><i class="sw wk"></i>Sunday (off)</span>
    <span><i class="sw lw"></i>Leave over a Sunday or holiday</span>
    <span><i class="sw hol"></i>Public holiday</span>
    <span><i class="sw td"></i>Today</span>
  </div>
  <div class="gwrap"><table class="g" id="g"></table></div>
  <p class="note" id="note"></p>
</main>

<script src="data.js?v=3"></script>
<script src="shared.js?v=3"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
const rows = Store.load().filter(r => validISO(r.from));
const bad = rows.filter(r => leaveDays(r) == null);
const leaves = rows.filter(r => leaveDays(r) != null);
leaves.forEach(r => { r._s = effStart(r) || "9999"; }); // first working day of leave
const TODAY = toISO(new Date());
const DOW = ["S","M","T","W","T","F","S"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const allDepts = [...new Set(leaves.map(r => r.dept || "Not given"))].sort();
const prefKey = "staffLeave.ganttPrefs";
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem(prefKey)) || {}; } catch (e) {}
let selDepts = new Set((prefs.depts || []).filter(d => allDepts.includes(d)));
["preset", "year", "status", "group", "onlyAway"].forEach(k => { if (prefs[k]) $(k).value = prefs[k]; });
if (prefs.preset === "custom" && prefs.from && prefs.to) { $("dFrom").value = prefs.from; $("dTo").value = prefs.to; }
function savePrefs() {
  try { localStorage.setItem(prefKey, JSON.stringify({ preset: $("preset").value, year: $("year").value, status: $("status").value, group: $("group").value, onlyAway: $("onlyAway").value, depts: [...selDepts], from: $("dFrom").value, to: $("dTo").value })); } catch (e) {}
}

function applyPreset() {
  const p = $("preset").value, t = new Date();
  let a, b;
  if (p === "month") { a = new Date(t.getFullYear(), t.getMonth(), 1); b = new Date(t.getFullYear(), t.getMonth() + 1, 0); }
  else if (p === "next30") { a = addDays(t, -3); b = addDays(t, 30); }
  else if (p === "next90") { a = addDays(t, -3); b = addDays(t, 90); }
  else if (/^q\d$/.test(p)) { const y = +$("year").value, q = +p[1] - 1; a = new Date(y, q * 3, 1); b = new Date(y, q * 3 + 3, 0); }
  else if (p === "year") { const y = +$("year").value; a = new Date(y, 0, 1); b = new Date(y, 11, 31); }
  else return;
  $("dFrom").value = toISO(a); $("dTo").value = toISO(b);
}

function shift(dir) {
  const a = fromISO($("dFrom").value), b = fromISO($("dTo").value);
  const sameMonthSpan = a.getDate() === 1 && addDays(b, 1).getDate() === 1;
  if (sameMonthSpan) {
    const months = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() + 1;
    $("dFrom").value = toISO(new Date(a.getFullYear(), a.getMonth() + dir * months, 1));
    $("dTo").value = toISO(new Date(b.getFullYear(), b.getMonth() + dir * months + 1, 0));
  } else {
    const n = daysBetween(toISO(a), toISO(b)) + 1;
    $("dFrom").value = toISO(addDays(a, dir * n)); $("dTo").value = toISO(addDays(b, dir * n));
  }
  $("preset").value = "custom"; render();
}

function renderChips() {
  const counts = {};
  leaves.forEach(r => { const d = r.dept || "Not given"; (counts[d] ||= new Set()).add(r.id || r.name); });
  $("deptChips").innerHTML = `<span class="chip${selDepts.size ? "" : " on"}" data-d="">All departments</span>` +
    allDepts.map(d => `<span class="chip${selDepts.has(d) ? " on" : ""}" data-d="${esc(d)}">${esc(d)}<span class="n">${counts[d].size}</span></span>`).join("");
}

function render() {
  savePrefs();
  let from = $("dFrom").value, to = $("dTo").value;
  if (!validISO(from) || !validISO(to)) return;
  if (to < from) [from, to] = [to, from];
  const days = [];
  for (let d = fromISO(from); toISO(d) <= to; d = addDays(d, 1)) days.push(toISO(d));
  if (days.length > 731) { $("g").innerHTML = `<tr><td class="empty">Pick a range of two years or less.</td></tr>`; return; }

  const q = $("q").value.trim().toLowerCase();
  const showPend = $("status").value === "all";
  const items = leaves.filter(r => (showPend || r.approved)
    && (!selDepts.size || selDepts.has(r.dept || "Not given"))
    && (!q || `${r.id} ${r.name}`.toLowerCase().includes(q)));

  // one row per employee (by ID, else by name); latest entry wins for name/department
  const people = new Map();
  items.slice().sort((a, b) => a.from < b.from ? -1 : 1).forEach(r => {
    const key = r.id || r.name.toLowerCase();
    const p = people.get(key) || { key, leaves: [] };
    p.name = r.name; p.id = r.id; p.dept = r.dept || "Not given"; p.leaves.push(r);
    people.set(key, p);
  });
  let list = [...people.values()];
  const inRange = p => p.leaves.some(r => r.to >= from && r._s <= to);
  if ($("onlyAway").value === "1") list = list.filter(inRange);
  list.sort((a, b) => {
    const fa = a.leaves.find(r => r.to >= from)?.from || "9", fb = b.leaves.find(r => r.to >= from)?.from || "9";
    return fa < fb ? -1 : fa > fb ? 1 : a.name.localeCompare(b.name);
  });

  const grouped = $("group").value === "dept";
  const groups = grouped
    ? [...new Set(list.map(p => p.dept))].sort().map(g => [g, list.filter(p => p.dept === g)])
    : [["", list]];

  const compact = days.length > 100;
  $("g").className = "g" + (compact ? " compact" : "");
  const dayCls = s => {
    const d = fromISO(s), c = [];
    if (HOLIDAYS[s]) c.push("hol"); else if (d.getDay() === 0) c.push("wk");
    if (s === TODAY) c.push("today");
    return c.join(" ");
  };
  const dayTitle = s => `${fmt(s)}${HOLIDAYS[s] ? " · " + HOLIDAYS[s] : ""}`;

  // header
  let h = "<thead><tr><th class='name' rowspan='3'>Employee</th>";
  let i = 0;
  while (i < days.length) {
    const m = days[i].slice(0, 7); let n = 0;
    while (i + n < days.length && days[i + n].slice(0, 7) === m) n++;
    const d = fromISO(days[i]);
    h += `<th class='mon' colspan='${n}'>${n * (compact ? 14 : 26) > 70 ? MONTHS_LONG[d.getMonth()] + " " + d.getFullYear() : MONTHS[d.getMonth()]}</th>`;
    i += n;
  }
  h += "</tr><tr>" + days.map(s => `<th class='day dow ${dayCls(s)}' title='${dayTitle(s)}'>${compact ? "" : DOW[fromISO(s).getDay()]}</th>`).join("");
  h += "</tr><tr>" + days.map(s => { const d = fromISO(s).getDate(); return `<th class='day dnum ${dayCls(s)}' title='${dayTitle(s)}'>${compact ? (d === 1 || d % 5 === 0 ? d : "") : d}</th>`; }).join("");
  h += "</tr></thead><tbody>";

  const away = days.map(() => 0), awayPend = days.map(() => 0);
  let personDays = 0;
  groups.forEach(([g, ppl]) => {
    if (grouped) h += `<tr class='grp'><th class='name'>${esc(g)} <small>${ppl.length}</small></th><td colspan='${days.length}'></td></tr>`;
    ppl.forEach(p => {
      const st = days.map(s => {
        let v = "", t = "";
        for (const r of p.leaves) if (s >= r._s && s <= r.to) {
          if (r.approved) { v = "l"; t = r; break; } else if (!v) { v = "p"; t = r; }
        }
        return [v, t];
      });
      h += `<tr><th class='name' title='${esc(p.name)} · ${esc(p.id)} · ${esc(p.dept)}'>${esc(p.name)}${p.id ? `<small>${esc(p.id)}</small>` : ""}</th>`;
      st.forEach(([v, r], k) => {
        if (v === "l") { away[k]++; personDays++; } else if (v === "p") awayPend[k]++;
        const s = v && st[k - 1]?.[0] !== v ? " s" : "", e = v && st[k + 1]?.[0] !== v ? " e" : "";
        const tip = v ? `${p.name} · ${fmt(r._s)} – ${fmt(r.to)} (${leaveDays(r)} days) · ${r.approved ? "Approved" : "Pending"}` : dayTitle(days[k]);
        h += `<td class='day ${dayCls(days[k])} ${v}${s}${e}' title='${esc(tip)}'></td>`;
      });
      h += "</tr>";
    });
  });

  const peak = Math.max(0, ...away);
  h += "<tr class='tot'><th class='name'>People away</th>";
  days.forEach((s, k) => {
    const n = away[k], heat = !n ? "" : n >= peak * 0.8 ? "h3" : n >= peak * 0.45 ? "h2" : "h1";
    const tip = `${fmt(s)}: ${n} approved${awayPend[k] ? `, ${awayPend[k]} pending` : ""}`;
    h += `<td class='day ${dayCls(s)} ${heat}' title='${tip}'>${n || ""}</td>`;
  });
  h += "</tr></tbody>";
  $("g").innerHTML = list.length ? h : `<tr><td class="empty">Nobody matches these filters in this period.</td></tr>`;

  // titles & stats
  $("title").textContent = `Team leave, ${fmt(from)} – ${fmt(to)}`;
  const todayAway = new Set(leaves.filter(r => r.approved && r._s <= TODAY && r.to >= TODAY && (!selDepts.size || selDepts.has(r.dept || "Not given"))).map(r => r.id || r.name)).size;
  const peakDays = days.filter((_, k) => away[k] === peak && peak > 0);
  const pending = list.reduce((n, p) => n + p.leaves.filter(r => !r.approved && r.to >= from && r._s <= to).length, 0);
  $("stats").innerHTML =
    `<div class="stat"><b>${todayAway}</b><span>On leave today</span></div>` +
    `<div class="stat"><b>${list.filter(inRange).length}</b><span>People away in this period</span></div>` +
    `<div class="stat"><b>${peak}</b><span>Peak on one day${peakDays.length ? " · " + fmt(peakDays[0]).replace(/ \d{4}$/, "") : ""}</span></div>` +
    `<div class="stat"><b>${personDays}</b><span>Person-days of leave</span></div>` +
    (showPend ? `<div class="stat"><b style="color:var(--pending)">${pending}</b><span>Pending requests</span></div>` : "");

  const notes = [];
  if (peak) notes.push(`Peak absence is ${peak} ${peak === 1 ? "person" : "people"} on ${peakDays.length > 4 ? peakDays.length + " days, first on " + fmt(peakDays[0]) : peakDays.map(fmt).join(", ")}.`);
  notes.push("Days are calendar days from the first working day to the last day; Sundays and public holidays at the start of a leave are not counted. Hover any cell for details.");
  if (bad.length) notes.push(`${bad.length} entr${bad.length === 1 ? "y has" : "ies have"} an invalid or missing end date and ${bad.length === 1 ? "is" : "are"} not drawn (${bad.map(r => esc(r.name)).join(", ")}). Fix on the Leave list page.`);
  $("note").innerHTML = notes.map(n => `<span>${n}</span>`).join(" ");

  // keep today in view
  const ti = days.indexOf(TODAY);
  if (ti > 10) { const w = compact ? 14 : 26; $("g").parentElement.scrollLeft = Math.max(0, (ti - 5) * w); }
}

$("deptChips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const d = c.dataset.d;
  if (!d) selDepts.clear(); else selDepts.has(d) ? selDepts.delete(d) : selDepts.add(d);
  renderChips(); render();
});
$("preset").addEventListener("change", () => { applyPreset(); render(); });
$("year").addEventListener("change", () => { if (/^q\d$|^year$/.test($("preset").value)) { applyPreset(); render(); } else { $("preset").value = "year"; applyPreset(); render(); } });
["dFrom", "dTo"].forEach(id => $(id).addEventListener("change", () => { $("preset").value = "custom"; render(); }));
["q", "status", "group", "onlyAway"].forEach(id => $(id).addEventListener("input", render));
$("prevBtn").addEventListener("click", () => shift(-1));
$("nextBtn").addEventListener("click", () => shift(1));
$("todayBtn").addEventListener("click", () => { $("preset").value = "month"; applyPreset(); render(); });

if ($("preset").value !== "custom" || !validISO($("dFrom").value)) { if ($("preset").value === "custom") $("preset").value = "month"; applyPreset(); }
renderChips();
render();
</script>
</body>
</html>
