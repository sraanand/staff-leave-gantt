<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Leave</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="top">
  <span class="brand">Staff Leave</span>
  <nav class="tabs"><a href="index.html" class="on">Leave</a><a href="gantt.html">Gantt</a><a href="holidays.html">Holidays</a></nav>
  <span class="spacer"></span>
  <a class="icon-btn" href="data.html" title="Import, backup and reset" aria-label="Data settings">⚙</a>
  <button class="icon-btn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light/dark">◐</button>
</div>

<main class="narrow">
  <div class="page-head">
    <h1>Leave</h1>
    <button class="btn primary desk-only" id="addBtn">+ New leave</button>
  </div>

  <div class="seg" id="views" role="tablist">
    <button data-v="today" role="tab"><span class="long">On leave </span><span class="cap">today</span> <span class="cnt" id="cToday"></span></button>
    <button data-v="pending" role="tab">Pending<span class="long"> approval</span> <span class="cnt" id="cPending"></span></button>
    <button data-v="all" role="tab">All<span class="long"> leave</span></button>
  </div>

  <div class="filters">
    <input type="search" id="q" placeholder="Search name or ID" aria-label="Search">
    <select id="fDept" aria-label="Department"><option value="">All departments</option></select>
    <select id="fRange" aria-label="Dates">
      <option value="any">Any date</option>
      <option value="month">This month</option>
      <option value="next30">Next 30 days</option>
      <option value="year">This year</option>
      <option value="custom">Custom dates…</option>
    </select>
    <div class="custom-range" id="customRange" hidden>
      <input type="date" id="rFrom" aria-label="From"><span class="muted">to</span><input type="date" id="rTo" aria-label="To">
    </div>
  </div>

  <p class="list-meta" id="meta"></p>
  <div class="card items" id="items"></div>
</main>

<button class="fab mob-only" id="fab" aria-label="New leave">＋</button>
<div class="toast" id="toast" hidden></div>

<!-- Leave entry form -->
<dialog class="sheet" id="ed">
  <form id="edForm" novalidate>
    <div class="sheet-head">
      <button type="button" class="link-btn" id="edCancel">Cancel</button>
      <b id="edTitle">New leave</b>
      <button type="submit" class="link-btn strong">Save</button>
    </div>
    <div class="sheet-body">
      <div class="row2">
        <label class="f"><span>Employee no.</span><input id="fId" inputmode="numeric" autocomplete="off" placeholder="e.g. 5150"></label>
        <label class="f"><span>Department</span><input id="fDeptIn" list="deptList" autocomplete="off" placeholder="e.g. Production"></label>
      </div>
      <label class="f"><span>Employee name</span><input id="fName" list="nameList" autocomplete="off" placeholder="Start typing a name"></label>
      <div class="row2">
        <label class="f"><span>First day away</span><input type="date" id="fFrom"></label>
        <label class="f"><span>Last day away</span><input type="date" id="fTo"></label>
      </div>
      <p class="days-line" id="daysLine"></p>

      <label class="switch">
        <input type="checkbox" id="fApproved">
        <span class="track"></span>
        <span>Approved by manager</span>
      </label>

      <div class="photo-box">
        <span class="f-label">Signed approval form</span>
        <div id="photoEmpty">
          <button type="button" class="btn big" id="takePhoto">📷 Take photo</button>
          <button type="button" class="link-btn" id="pickPhoto">or choose a file</button>
        </div>
        <div id="photoHas" hidden>
          <img id="thumb" alt="Signed approval form" title="Tap to enlarge">
          <div class="photo-actions">
            <button type="button" class="btn" id="retake">Retake</button>
            <button type="button" class="btn danger" id="rmPhoto">Remove</button>
          </div>
        </div>
      </div>
      <p class="err" id="err" hidden></p>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn danger" id="edDelete" hidden>Delete leave</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="edCancel2">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="pick" accept="image/*" hidden>
</dialog>

<dialog class="viewer" id="imgDlg">
  <img id="bigImg" alt="Signed approval form">
  <button class="btn" id="imgClose">Close</button>
</dialog>

<datalist id="deptList"></datalist>
<datalist id="nameList"></datalist>

<script src="data.js?v=4"></script>
<script src="shared.js?v=4"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
let rows = Store.load();
const TODAY = toISO(new Date());
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dShort = s => { const d = fromISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const dDay = s => { const d = fromISO(s); return `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const range = r => {
  if (!validISO(r.from)) return "No dates";
  if (!validISO(r.to)) return `${fmt(r.from)} – ?`;
  return r.from.slice(0, 4) === r.to.slice(0, 4) ? `${dShort(r.from)} – ${fmt(r.to)}` : `${fmt(r.from)} – ${fmt(r.to)}`;
};
const nextWorkingDay = iso => { let d = addDays(fromISO(iso), 1); while (isOffDay(toISO(d))) d = addDays(d, 1); return toISO(d); };
const awayToday = r => { const s = effStart(r); return !!s && s <= TODAY && r.to >= TODAY; };

// ---- prefs ----
const P = (() => { try { return JSON.parse(localStorage.getItem("staffLeave.listPrefs")) || {}; } catch (e) { return {}; } })();
let view = P.view || "today";
$("fRange").value = P.range || "year";
const savePrefs = () => { try { localStorage.setItem("staffLeave.listPrefs", JSON.stringify({ view, range: $("fRange").value })); } catch (e) {} };

function directory() {
  const byId = {}, byName = {};
  rows.slice().sort((a, b) => (a.from || "") < (b.from || "") ? -1 : 1).forEach(r => {
    if (r.id) byId[r.id] = { name: r.name, dept: r.dept };
    if (r.name) byName[r.name.toLowerCase()] = { id: r.id, dept: r.dept, name: r.name };
  });
  return { byId, byName };
}
function refreshLists() {
  const depts = [...new Set(rows.map(r => r.dept).filter(Boolean))].sort();
  const cur = $("fDept").value;
  $("fDept").innerHTML = `<option value="">All departments</option>` + depts.map(d => `<option${d === cur ? " selected" : ""}>${esc(d)}</option>`).join("");
  $("deptList").innerHTML = depts.map(d => `<option value="${esc(d)}">`).join("");
  const { byName } = directory();
  $("nameList").innerHTML = Object.values(byName).sort((a, b) => a.name.localeCompare(b.name))
    .map(p => `<option value="${esc(p.name)}">${esc(p.id)} · ${esc(p.dept)}</option>`).join("");
}

function rangeBounds() {
  const v = $("fRange").value, t = new Date();
  if (v === "month") return [toISO(new Date(t.getFullYear(), t.getMonth(), 1)), toISO(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
  if (v === "next30") return [TODAY, toISO(addDays(t, 30))];
  if (v === "year") return [`${t.getFullYear()}-01-01`, `${t.getFullYear()}-12-31`];
  if (v === "custom" && validISO($("rFrom").value) && validISO($("rTo").value)) return [$("rFrom").value, $("rTo").value];
  return null;
}

function render() {
  savePrefs();
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  const showRange = view === "all";
  $("fRange").hidden = !showRange;
  $("customRange").hidden = !(showRange && $("fRange").value === "custom");

  const q = $("q").value.trim().toLowerCase(), dep = $("fDept").value;
  const base = rows.filter(r => (!dep || r.dept === dep) && (!q || `${r.id} ${r.name}`.toLowerCase().includes(q)));
  const today = base.filter(awayToday), pending = base.filter(r => !r.approved);
  $("cToday").textContent = today.length;
  $("cPending").textContent = pending.length;
  $("cPending").classList.toggle("alert", pending.length > 0);

  let list, meta;
  if (view === "today") {
    list = today.sort((a, b) => a.to < b.to ? -1 : 1);
    meta = `${list.length} ${list.length === 1 ? "person" : "people"} away on ${dDay(TODAY)}`;
  } else if (view === "pending") {
    list = pending.sort((a, b) => (a.from || "") < (b.from || "") ? -1 : 1);
    meta = list.length ? `${list.length} waiting for approval. Tap Approve, or open a leave to add the signed form.` : "";
  } else {
    const b = rangeBounds();
    list = base.filter(r => !b || ((r.to || r.from || "") >= b[0] && (r.from || "") <= b[1]))
      .sort((a, b) => (a.from || "") > (b.from || "") ? -1 : 1);
    meta = `${list.length} leave ${list.length === 1 ? "entry" : "entries"}, newest first`;
  }
  $("meta").textContent = meta;

  const empty = { today: "Nobody is on leave today.", pending: "Nothing waiting for approval. 👍", all: "No leave matches these filters." }[view];
  $("items").innerHTML = list.map(item).join("") || `<div class="empty">${empty}</div>`;
}

function item(r) {
  const n = leaveDays(r), bad = n == null;
  let when = range(r), sub = bad ? "" : `${n} day${n === 1 ? "" : "s"}`;
  if (view === "today" && !bad) sub = `Back ${dDay(nextWorkingDay(r.to))}`;
  const pill = bad ? `<span class="pill bad">Check dates</span>`
    : r.approved ? `<span class="pill ok">Approved</span>` : `<button class="pill pend act" data-approve>Approve</button>`;
  return `<div class="item" data-u="${r.uid}" tabindex="0">
    <div class="who"><b>${esc(r.name || "(no name)")}</b><span>${esc([r.id, r.dept].filter(Boolean).join(" · "))}</span></div>
    <div class="when"><b>${when}</b><span>${sub}${r.doc ? ' · <span title="Signed form attached">📄 form</span>' : ""}</span></div>
    <div class="state">${r.approved || bad ? pill : `<span class="pill pend">Pending</span>${pill}`}</div>
  </div>`;
}

// ---- list interactions ----
$("views").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { view = b.dataset.v; render(); } });
["q", "fDept", "fRange", "rFrom", "rTo"].forEach(id => $(id).addEventListener("input", render));
$("items").addEventListener("click", e => {
  const it = e.target.closest(".item"); if (!it) return;
  const r = rows.find(x => x.uid === it.dataset.u);
  if (e.target.closest("[data-approve]")) {
    r.approved = true; Store.save(rows); render();
    toast(`Approved: ${r.name}`, () => { r.approved = false; Store.save(rows); render(); });
    return;
  }
  openEditor(r);
});
$("items").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("item")) e.target.click(); });

let toastT;
function toast(msg, undo) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? `<button class="link-btn strong">Undo</button>` : "");
  t.hidden = false;
  if (undo) t.querySelector("button").onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
}

// ---- editor ----
let editing = null, photo = null, dirty = false, autoFilled = {};
const F = { id: $("fId"), name: $("fName"), dept: $("fDeptIn"), from: $("fFrom"), to: $("fTo"), approved: $("fApproved") };

async function openEditor(r) {
  editing = r || null; dirty = false; autoFilled = {};
  photo = { blob: null, url: null, changed: false };
  $("edTitle").textContent = r ? "Edit leave" : "New leave";
  $("edDelete").hidden = !r;
  F.id.value = r?.id || ""; F.name.value = r?.name || ""; F.dept.value = r?.dept || "";
  F.from.value = validISO(r?.from) ? r.from : ""; F.to.value = validISO(r?.to) ? r.to : "";
  F.approved.checked = !!r?.approved;
  $("err").hidden = true;
  if (r?.doc) { const b = await Docs.get(r.uid).catch(() => null); if (b) setPhoto(b, false); }
  showPhoto(); updateDays();
  $("ed").showModal();
  if (!r) setTimeout(() => F.id.focus(), 50);
}
function setPhoto(blob, changed = true) {
  if (photo.url) URL.revokeObjectURL(photo.url);
  photo = { blob, url: blob ? URL.createObjectURL(blob) : null, changed };
  showPhoto();
}
function showPhoto() {
  $("photoHas").hidden = !photo.blob; $("photoEmpty").hidden = !!photo.blob;
  if (photo.blob) $("thumb").src = photo.url;
}
function updateDays() {
  const from = F.from.value, to = F.to.value, el = $("daysLine");
  el.className = "days-line";
  if (!validISO(from) || !validISO(to)) { el.textContent = ""; return; }
  if (to < from) { el.textContent = "The last day is before the first day."; el.classList.add("bad"); return; }
  const r = { from, to }, n = leaveDays(r), s = effStart(r);
  let txt = !s ? "All of these days are Sundays or holidays, so this is 0 days of leave."
    : `${n} day${n === 1 ? "" : "s"} of leave` + (s !== from ? `, counted from ${dDay(s)} because it starts on a Sunday or holiday` : "");
  const key = F.id.value.trim() || F.name.value.trim().toLowerCase();
  const clash = rows.find(x => x !== editing && key && (x.id === key || x.name.toLowerCase() === key) && validISO(x.to) && x.from <= to && x.to >= from);
  if (clash) txt += `. ⚠ This overlaps another leave for this person (${range(clash)}).`;
  el.textContent = txt;
}
function closeEditor(force) {
  if (!force && dirty && !confirm("Discard this entry? It hasn't been saved.")) return;
  if (photo?.url) URL.revokeObjectURL(photo.url);
  $("ed").close();
}

$("edForm").addEventListener("input", e => {
  dirty = true;
  if (e.target === F.from && validISO(F.from.value) && (!validISO(F.to.value) || F.to.value < F.from.value)) F.to.value = F.from.value;
  if (e.target === F.id || e.target === F.name) autofill(e.target);
  if (e.target !== F.approved) $("err").hidden = true;
  updateDays();
});
function autofill(src) {
  const { byId, byName } = directory();
  if (src === F.id) {
    const p = byId[F.id.value.trim()];
    if (p) {
      if (!F.name.value || autoFilled.name) { F.name.value = p.name; autoFilled.name = true; }
      if (!F.dept.value || autoFilled.dept) { F.dept.value = p.dept; autoFilled.dept = true; }
    }
  } else {
    autoFilled.name = false;
    const p = byName[F.name.value.trim().toLowerCase()];
    if (p) {
      if (!F.id.value || autoFilled.id) { F.id.value = p.id; autoFilled.id = true; }
      if (!F.dept.value || autoFilled.dept) { F.dept.value = p.dept; autoFilled.dept = true; }
    }
  }
}

$("edForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = { id: F.id.value.trim(), name: F.name.value.trim(), dept: F.dept.value.trim() || "Not given", from: F.from.value, to: F.to.value, approved: F.approved.checked };
  const problem = !v.name ? "Enter the employee's name." : !validISO(v.from) ? "Pick the first day away." : !validISO(v.to) ? "Pick the last day away." : v.to < v.from ? "The last day is before the first day." : "";
  if (problem) { $("err").textContent = problem; $("err").hidden = false; return; }
  const r = editing || { uid: uid() };
  Object.assign(r, v);
  if (photo.changed) {
    try {
      if (photo.blob) { await Docs.put(r.uid, photo.blob); r.doc = true; }
      else { await Docs.del(r.uid); r.doc = false; }
    } catch (err) { alert("The photo couldn't be stored on this device: " + err.message); }
  }
  if (!editing) rows.push(r);
  Store.save(rows); refreshLists();
  closeEditor(true);
  if (!editing && view === "today" && !awayToday(r)) view = "all";
  render();
  toast(editing ? `Saved changes for ${r.name}` : `Saved leave for ${r.name}`);
});
$("edDelete").addEventListener("click", () => {
  const r = editing;
  if (!confirm(`Delete ${r.name}'s leave (${range(r)})? This can't be undone.`)) return;
  if (r.doc) Docs.del(r.uid).catch(() => {});
  rows = rows.filter(x => x !== r); Store.save(rows); refreshLists();
  closeEditor(true); render(); toast(`Deleted leave for ${r.name}`);
});
$("edCancel").addEventListener("click", () => closeEditor());
$("edCancel2").addEventListener("click", () => closeEditor());
$("ed").addEventListener("cancel", e => { e.preventDefault(); closeEditor(); });

// photo
async function onPhoto(e) {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    setPhoto(await shrinkImage(file)); dirty = true;
    if (!F.approved.checked) { F.approved.checked = true; toast("Marked approved because a signed form was added"); }
  } catch (err) { alert(err.message); }
}
$("cam").addEventListener("change", onPhoto);
$("pick").addEventListener("change", onPhoto);
$("takePhoto").addEventListener("click", () => $("cam").click());
$("retake").addEventListener("click", () => $("cam").click());
$("pickPhoto").addEventListener("click", () => $("pick").click());
$("rmPhoto").addEventListener("click", () => { setPhoto(null); dirty = true; });
$("thumb").addEventListener("click", () => { $("bigImg").src = photo.url; $("imgDlg").showModal(); });
$("imgClose").addEventListener("click", () => $("imgDlg").close());

["addBtn", "fab"].forEach(id => $(id).addEventListener("click", () => openEditor(null)));

refreshLists();
render();
</script>
</body>
</html>
